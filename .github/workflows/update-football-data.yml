name: Update football data (manual API only)

on:
  # Automatic API updates are paused. Public-source snapshots are reviewed manually.
  workflow_dispatch:
    inputs:
      mode:
        description: Optional API update mode (requires a working key)
        required: true
        default: full
        type: choice
        options:
          - full
          - scheduled

permissions:
  contents: write

concurrency:
  group: football-data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Run selected update
        id: update
        shell: bash
        env:
          FOOTBALL_DATA_PROVIDER: goal-api
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          FOOTBALL_DATA_SEASON: ${{ vars.FOOTBALL_DATA_SEASON || vars.GOAL_API_SEASON || '2026' }}
          GOAL_API_SEASON: ${{ vars.FOOTBALL_DATA_SEASON || vars.GOAL_API_SEASON || '2026' }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_SEASON: ${{ vars.API_FOOTBALL_SEASON || vars.FOOTBALL_DATA_SEASON || vars.GOAL_API_SEASON || '2026' }}
          UPDATE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$UPDATE_MODE" == "full" ]]; then
            npm run data:update
          else
            npm run data:update:scheduled
          fi

          if git diff --quiet -- src/data/generated/snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.update.outputs.changed == 'true'
        run: npm ci

      - name: Validate generated data
        if: steps.update.outputs.changed == 'true'
        run: npm run data:validate

      - name: Run tests
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ "$test_status" -ne 0 ]]; then
            node -e 'const fs = require("node:fs"); const lines = fs.readFileSync("test-output.log", "utf8").split(/\r?\n/).slice(-40).join("\n"); const escaped = lines.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"); console.log(`::error title=Node test failure::${escaped}`)'
            exit "$test_status"
          fi

      - name: Lint source
        if: steps.update.outputs.changed == 'true'
        run: npm run lint

      - name: Build site
        if: steps.update.outputs.changed == 'true'
        run: npm run build

      - name: Commit generated snapshot and build
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          git add -- src/data/generated/snapshot.json dist
          if git diff --cached --quiet; then
            echo "Generated data and build are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh football data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
